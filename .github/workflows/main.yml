name: Main Workflow
on:
  push:
  schedule:
    - cron: "0 0 * * 0"
jobs:
  build:
    name: Build
    timeout-minutes: 10
    strategy:
      matrix:
        rust-version: [
          "1.82.0",
          "1.83.0",
          "1.84.0",
          "1.85.0",
          "latest"
        ]
    runs-on: ubuntu-latest
    container: rust:${{ matrix.rust-version }}
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v4
      - name: Install Rust components
        run: |
          rustup component add rustfmt
          rustup component add clippy
      - name: Print Rust information
        run: rustc --version
      - name: Verify Rust code format
        run: cargo fmt --all -- --check
      - name: Verify Rust code linting
        run: cargo clippy -- -D warnings -A unknown-lints
      - name: Run unit tests
        run: cargo test
      - name: Build development version
        run: cargo build
      - name: Build release version
        run: cargo build --release
  build-wasm:
    name: Build WASM
    timeout-minutes: 30
    strategy:
      matrix:
        rust-version: [
          "1.91.0",
          "1.92.0",
          "1.93.0",
          "1.94.0",
          "latest"
        ]
        node-version: ["18"]
    runs-on: ubuntu-latest
    container: rust:${{ matrix.rust-version }}
    env:
      SWC_NATIVE_BINDING_CACHE: /tmp/swc
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y -q cmake
      - name: Install Rust components
        run: |
          rustup component add rustfmt
          rustup component add clippy
      - name: Print Rust information
        run: rustc --version
      - name: Verify Rust code format
        run: cargo fmt --all -- --check
      - name: Verify Rust code linting
        run: cargo clippy -- -D warnings -A unknown-lints
      - name: Run unit tests
        run: cargo test
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Build WASM Web binary
        run: wasm-pack build --release --target=web --out-dir=frontends/web/lib -- --features wasm
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build and lint Web code
        run: cd frontends/web && npm install && npm run build && npm run lint
  build-sdl:
    name: Build SDL
    timeout-minutes: 30
    strategy:
      matrix:
        rust-version: [
          "1.88.0",
          "1.89.0",
          "1.90.0",
          "1.91.0",
          "1.92.0",
          "1.93.0",
          "latest"
        ]
    runs-on: ubuntu-latest
    container: rust:${{ matrix.rust-version }}
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y -q zip python3-jinja2
      - name: Install Rust components
        run: |
          rustup component add rustfmt
          rustup component add clippy
      - name: Print Rust information
        run: rustc --version
      - name: Detect Linux distribution
        id: distro
        run: . /etc/os-release && echo "codename=$VERSION_CODENAME" >> "$GITHUB_OUTPUT"
      - name: Detect vcpkg revision
        id: vcpkg
        run: echo "rev=$(sed -n '/^\[package\.metadata\.vcpkg\]/,/^\[/ s/^rev = "\(.*\)"$/\1/p' frontends/sdl/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Cache SDL build
        uses: actions/cache@v6
        with:
          path: |
            ~/.vcpkg-root
            ~/.cache/vcpkg
            ~/vcpkg
            target/vcpkg
          key: vcpkg-${{ runner.os }}-${{ steps.distro.outputs.codename }}-${{ steps.vcpkg.outputs.rev }}-${{ matrix.rust-version }}-${{ hashFiles('frontends/sdl/Cargo.toml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ steps.distro.outputs.codename }}-${{ steps.vcpkg.outputs.rev }}-${{ matrix.rust-version }}-
            vcpkg-${{ runner.os }}-${{ steps.distro.outputs.codename }}-${{ steps.vcpkg.outputs.rev }}-
      - name: Install SDL dependencies
        run: cd frontends/sdl && cargo install cargo-vcpkg && cargo vcpkg -v build
      - name: Verify Rust code format
        run: cd frontends/sdl && cargo fmt --all -- --check
      - name: Verify Rust code linting
        run: cd frontends/sdl && cargo clippy -- -D warnings -A unknown-lints
      - name: Run unit tests
        run: cd frontends/sdl && cargo test
      - name: Run all unit tests
        run: cargo test --all
      - name: Build all documentation
        run: cargo doc --all --all-features
      - name: Build development version
        run: cd frontends/sdl && cargo build
      - name: Build release version
        run: cd frontends/sdl && cargo build --release
